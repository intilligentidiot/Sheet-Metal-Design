<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Tesla Mechanical Designs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Add Google reCAPTCHA v2 API Script here if needed -->
    <!-- <script src="https://www.google.com/recaptcha/api.js" async defer></script> -->
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#cc0000', darkBg: '#0a0a0a', surface: '#141414', }, fontFamily: { sans: ['Space Grotesk', 'sans-serif'], }, borderRadius: { 'custom': '1rem', } } } }
    </script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: "Space Grotesk", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .thin-border-b { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .thin-border-t { border-top: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>

<body>

    <nav class="fixed top-0 w-full z-50 bg-darkBg/80 backdrop-blur-md thin-border-b" aria-label="Main Navigation">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
                <a href="index.html" class="text-xl font-bold tracking-tight uppercase">
                    TMD <span class="text-primary">Services</span>
                </a>
            </div>
            <div class="hidden md:flex space-x-8 text-sm font-medium tracking-wide uppercase">
                <a href="index.html#services" class="hover:text-primary transition-colors">Services</a>
                <a href="blog.html" class="hover:text-primary transition-colors">Insights (Blog)</a>
                <a href="tools/bend-calculator.html" class="hover:text-primary transition-colors">Tools</a>
            </div>
            <div>
                <a href="contact.html"
                    class="inline-block bg-primary hover:bg-red-700 text-white px-6 py-2 rounded-custom text-sm font-bold uppercase transition-all duration-300">
                    Contact Us
                </a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 min-h-screen px-6 max-w-4xl mx-auto">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tighter uppercase mb-4">Get In <span class="text-primary">Touch</span></h1>
            <p class="text-gray-400 font-light">Request an engineering technical review and competitive quote for your project.</p>
        </div>

        <div class="bg-surface p-8 md:p-12 rounded-custom border border-white/10 shadow-2xl">
            <!-- Ensure action points to correct endpoint, or thank-you.html for static demo -->
            <form action="thank-you.html" method="GET" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-400 uppercase tracking-widest mb-2">First Name</label>
                        <input type="text" id="firstName" name="firstName" required
                            class="w-full bg-darkBg border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-primary focus:border-primary transition-colors">
                    </div>
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-400 uppercase tracking-widest mb-2">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required
                            class="w-full bg-darkBg border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-primary focus:border-primary transition-colors">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-400 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full bg-darkBg border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-primary focus:border-primary transition-colors">
                </div>

                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-400 uppercase tracking-widest mb-2">Inquiry Type</label>
                    <select id="subject" name="subject"
                        class="w-full bg-darkBg border border-white/10 rounded-lg px-4 py-3 text-gray-300 focus:ring-primary focus:border-primary transition-colors">
                        <option value="quote">Request a Quote</option>
                        <option value="dfm">DFM Analysis</option>
                        <option value="general">General Inquiry</option>
                    </select>
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-gray-400 uppercase tracking-widest mb-2">Message</label>
                    <textarea id="message" name="message" rows="5" required
                        class="w-full bg-darkBg border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-primary focus:border-primary transition-colors"></textarea>
                </div>

                <!-- Google reCAPTCHA v2 Placeholder -->
                <div class="py-2">
                    <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY_HERE" style="transform:scale(0.85);-webkit-transform:scale(0.85);transform-origin:0 0;-webkit-transform-origin:0 0;">
                        <!-- Fallback visual block if script not loaded -->
                        <div class="bg-darkBg border border-white/10 rounded px-4 py-6 text-sm text-gray-500 uppercase tracking-widest flex items-center justify-center">
                            [ Google reCAPTCHA v2 Component ]
                        </div>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-red-700 text-white px-8 py-4 rounded-custom text-lg font-bold uppercase transition-all duration-300 shadow-xl shadow-primary/20">
                    Submit Inquiry
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-darkBg py-12 thin-border-t mt-auto w-full" aria-label="Footer">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex items-center space-x-2">
                <span class="text-lg font-bold tracking-tight uppercase">TMD <span class="text-primary">Services</span></span>
                <span class="text-gray-600 ml-4 pl-4 border-l border-white/10 text-xs text-center">&copy;
                    <script>document.write(new Date().getFullYear())</script> Tesla Mechanical Designs
                </span>
            </div>
            <div class="flex space-x-6 text-xs uppercase tracking-widest text-gray-400 font-semibold">
                <a href="#" class="hover:text-primary transition-colors">Privacy</a>
                <a href="#" class="hover:text-primary transition-colors">Terms</a>
                <a href="contact.html" class="hover:text-primary transition-colors">Contact</a>
            </div>
        </div>
    </footer>

</body>

</html>
